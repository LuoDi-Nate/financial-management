<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('登录 · 家庭账房')}"></head>
<body class="min-h-screen flex flex-col">

<!-- 装饰条 -->
<div class="fixed top-0 left-0 right-0 h-1 bg-ink z-40"></div>

<main class="flex-1 grid grid-cols-1 md:grid-cols-2 relative z-10">

  <!-- 左侧:引言 -->
  <div class="flex flex-col justify-between p-12 md:p-20 border-r border-rule">
    <div class="font-mono text-[10px] tracking-[0.22em] text-brass-deep">
      家 · 庭 · 账 · 房
    </div>
    <div class="my-12">
      <h1 class="font-display text-5xl md:text-7xl leading-[0.95] font-medium tracking-tight">
        凡入此册者,<br>
        <span class="italic text-brass-deep font-light">皆有定数。</span>
      </h1>
      <p class="font-serif text-lg text-ink-soft mt-8 max-w-md leading-relaxed">
        每月一日,系统按时备好账册;您与家人各自登录,异步落笔,十分钟内毕事。
      </p>
    </div>
    <div class="font-mono text-[10px] tracking-[0.18em] text-ink-subtle"
         th:text="'ANNO ' + ${#temporals.format(#temporals.createNow(), 'yyyy')} + ' · 家庭账房'">ANNO 2026 · 家庭账房</div>
  </div>

  <!-- 右侧:表单 -->
  <div class="flex items-center justify-center p-8 md:p-12 bg-card-soft">
    <div class="w-full max-w-md">

      <div class="flex items-baseline justify-between mb-10">
        <h2 class="font-display text-3xl">登录</h2>
        <div class="font-mono text-[10px] tracking-[0.16em] text-ink-subtle">SIGN IN</div>
      </div>

      <!-- 错误 / 退出提示 -->
      <div th:if="${error}"
           class="border border-rust bg-rust/[0.04] px-4 py-3 mb-6 text-sm"
           th:text="${error}">用户名或密码错误</div>
      <div th:if="${stale}"
           class="border border-rust bg-rust/[0.04] px-4 py-3 mb-6 text-sm"
           th:text="${stale}">这个页面停留太久了,请重新登录一次。</div>
      <div th:if="${logout}"
           class="border border-forest bg-forest/[0.05] px-4 py-3 mb-6 text-sm"
           th:text="${logout}">已退出</div>

      <form th:action="@{/login}" method="post" class="space-y-8">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <div>
          <label class="field-label" for="username">登录名 · USERNAME</label>
          <input id="username" name="username" type="text"
                 class="field-input" autocomplete="username"
                 required autofocus>
        </div>

        <div>
          <label class="field-label" for="password">口令 · PASSWORD</label>
          <div class="relative">
            <input id="password" name="password" type="password"
                   class="field-input pr-12" autocomplete="current-password"
                   required placeholder="">
            <button type="button" tabindex="-1" aria-label="显示/隐藏密码"
                    onclick="(()=>{const i=document.getElementById('password');i.type=i.type==='password'?'text':'password';this.textContent=i.type==='password'?'显示':'隐藏';})()"
                    class="absolute right-2 top-1/2 -translate-y-1/2 px-2 py-1 font-mono text-[10px] text-ink-soft hover:text-ink select-none">显示</button>
          </div>
        </div>

        <label class="flex items-center gap-3 select-none cursor-pointer pt-2">
          <!-- v1.11.1 · **默认勾选**。Session 在进程内存里(没上 spring-session),
               发版重启 = 全部会话失效 → 维护者反馈「发布后都需要重新登录」。
               remember-me 本身早就是 JDBC 持久化(persistent_logins 表,30 天),
               只是复选框默认不勾 → 没勾就没有持久凭据。家庭内部工具、单家庭部署,
               默认记住 30 天是合理默认;复选框保留,公用电脑可手动取消。 -->
          <input type="checkbox" name="remember-me" checked class="w-4 h-4 accent-[var(--brass)]">
          <span class="font-mono text-[11px] tracking-[0.14em] uppercase text-ink-soft">
            三十日免输 · keep me
          </span>
        </label>

        <div class="pt-4">
          <button type="submit" class="btn-ink btn-lg w-full justify-center">
            入册 · sign in
            <span class="font-display italic">→</span>
          </button>
        </div>
      </form>

      <div class="mt-12 pt-6 border-t border-rule">
        <div class="font-mono text-[10px] tracking-[0.16em] text-ink-subtle mb-3">忘了口令?</div>
        <p class="text-sm text-ink-soft leading-relaxed">
          请联系家庭中另一位成员,在「管理 · 成员」里为你重置一次性临时口令,登录后系统会引导你立刻设置新密码。
        </p>
      </div>

    </div>
  </div>

</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<script>
(function () {
  // 用户名长期记忆:成功登录前在 input 预填上次值;提交时把用户名写入 localStorage
  var KEY = 'finance_last_username';
  var input = document.getElementById('username');
  if (!input) return;
  try { var saved = localStorage.getItem(KEY); if (saved && !input.value) input.value = saved; } catch (_) {}
  var form = input.form;
  if (form) {
    form.addEventListener('submit', function () {
      try { localStorage.setItem(KEY, input.value || ''); } catch (_) {}
    });
  }
})();
</script>
</body>
</html>

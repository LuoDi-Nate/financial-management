<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('删除支出类目 · 家庭账房')}"></head>
<body class="min-h-screen relative">
<div class="fixed top-0 left-0 right-0 h-1 bg-ink z-40"></div>
<header th:replace="~{fragments/nav :: nav('entry', ${me}, ${nav})}"></header>
<main class="max-w-[720px] mx-auto px-4 sm:px-6 lg:px-10 py-5 sm:py-10 relative z-10">

  <div class="eyebrow mb-2">删 · 除 · 确 · 认</div>
  <h1 class="font-display text-2xl sm:text-3xl font-medium mb-5"
      th:text="'删掉「' + ${impact.name()} + '」?'">删掉这个类目?</h1>

  <!--/* 删除是不可逆动作,所以先把后果说全:动多少数据、钱去哪、什么不变。
         「合计一分不变」这句要明确讲 —— 用户最怕的是删类目把钱删没了。 */-->
  <div class="paper-card p-6 mb-5">
    <p class="text-[14px] text-ink leading-relaxed">
      <th:block th:if="${impact.rows() == 0}">
        它名下<b>还没有任何数据</b> —— 删掉就是干净删掉。
      </th:block>
      <th:block th:if="${impact.rows() > 0}">
        它名下 <b><span th:text="${impact.periods()}">7</span> 期、共 <span th:text="${impact.rows()}">7</span> 条</b>记录
        会转入 <b th:text="${impact.targetName()}">其他</b>。
      </th:block>
      <th:block th:if="${impact.childCount() > 0}">
        <br>它下面的 <b><span th:text="${impact.childCount()}">1</span> 个细类</b>也会一起删掉,数据同样转入
        <b th:text="${impact.targetName()}">其他</b>。
      </th:block>
    </p>

    <ul class="text-[13px] text-ink-soft leading-relaxed ml-4 list-disc space-y-1 mt-4">
      <li><b>合计一分不变</b> —— 变的只是这笔钱记在哪个名字下。</li>
      <li th:if="${!impact.topLevel()}">
        转到<b>父级</b>之后,它在报表里显示为<b>「<span th:text="${impact.targetName()}">餐饮美食 · 未细分</span>」</b>——
        大类的合计跟删之前<b>逐分相等</b>。
      </li>
      <li th:if="${impact.topLevel()}">
        转到<b>「其他」</b>之后,全家的支出总合计跟删之前<b>逐分相等</b>。
      </li>
      <li><b>这一步不可逆。</b>只是不想在新月份看到它的话,<b>「停用」</b>就够了 —— 历史照旧显示。</li>
    </ul>
  </div>

  <div class="flex items-center gap-3 flex-wrap">
    <form th:action="@{/expense/categories/{id}/delete(id=${catId})}" method="post">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
      <button type="submit" class="btn-danger btn-danger-fill"
              th:text="'转入「' + ${impact.targetName()} + '」并删除'">确认删除</button>
    </form>
    <a th:href="@{/expense/categories}" class="btn-ghost text-sm no-underline">算了</a>
  </div>

</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>

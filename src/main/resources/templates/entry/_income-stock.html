<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<body>
<!--/* v0.12 FR-150 · 股票账户收入:联动该账户已有持仓 · 就地按股数/金额入账。HTMX fragment。 */-->
<div th:fragment="holdings" class="space-y-3">

  <div class="font-mono text-[10px] tracking-[0.16em] uppercase text-brass-deep mb-1"
       th:text="${account.displayName} + ' · 已有持仓 · 选一个入账,或新建'">富途 · 已有持仓</div>

  <!--/* 已有持仓卡片 */-->
  <div th:if="${#lists.isEmpty(holdings)}" class="font-mono text-[11px] text-ink-subtle">
    该账户还没有持仓 · 下方「新建持仓入账」直接建仓 + 记这笔收入。
  </div>

  <div th:each="h : ${holdings}" class="border border-rule-soft bg-card px-4 py-3">
    <input type="hidden" name="_t" th:value="${h.valuationMode.name()}">

    <!--/* 上市 / 未上市:+股数 */-->
    <div th:if="${h.valuationMode.name() == 'AUTO' or h.valuationMode.name() == 'MANUAL'}">
      <div class="flex items-center gap-2 mb-2 flex-wrap">
        <span class="pill text-[9px]"
              th:classappend="${h.valuationMode.name() == 'AUTO'} ? ' pill-brass' : ''"
              th:style="${h.valuationMode.name() == 'MANUAL'} ? 'background:rgba(159,74,58,.08);color:var(--rust);border-color:var(--rust)' : ''"
              th:text="${h.valuationMode.name() == 'AUTO'} ? '上市' : '未上市'">上市</span>
        <span class="font-display" th:text="${h.displayName}">BABA</span>
        <span class="pill text-[9px]" th:if="${h.ticker != null}" th:text="${h.ticker}">BABA</span>
        <span class="font-mono text-[10px] text-ink-subtle"
              th:text="'现 ' + ${(h.shares != null ? h.shares : 1)} + ' 股'">现 120 股</span>
        <span class="font-mono text-[10px] text-ink-subtle" th:if="${unitValues.get(h.id) != null}"
              th:text="'· 单股 ' + ${account.currency} + ' ' + ${unitValues.get(h.id).stripTrailingZeros().toPlainString()}">· 单股 ¥78.5</span>
        <span class="font-mono text-[10px] text-rust" th:if="${unitValues.get(h.id) == null}">· 暂无价 · 先刷价</span>
      </div>
      <form th:action="@{/entry/income/stock/holding}" method="post" class="flex flex-wrap items-end gap-2">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <input type="hidden" name="periodId" th:value="${period.id}">
        <input type="hidden" name="accountId" th:value="${account.id}">
        <input type="hidden" name="holdingId" th:value="${h.id}">
        <input type="hidden" name="categoryCode" value="stock_salary">
        <div>
          <label class="font-mono text-[9px] uppercase text-ink-subtle mb-1 block">+ 增加股数(RSU 归属)</label>
          <input name="addShares" type="number" step="0.0001" min="0.0001" required placeholder="30"
                 class="w-24 font-mono bg-paper border border-rule px-3 py-2 tnum text-right">
        </div>
        <div class="flex-1 min-w-[120px]">
          <label class="font-mono text-[9px] uppercase text-ink-subtle mb-1 block">备注(选填)</label>
          <input name="note" maxlength="60" placeholder="如 2026Q2 归属"
                 class="w-full font-mono text-xs bg-paper border border-rule px-3 py-2">
        </div>
        <button type="submit" class="btn-ink text-sm" th:disabled="${unitValues.get(h.id) == null}">+ 入账</button>
      </form>
    </div>

    <!--/* 券商现金:+金额(股息/利息)· 走通用 /entry/income(dividend)*/-->
    <div th:if="${h.valuationMode.name() == 'CASH'}">
      <div class="flex items-center gap-2 mb-2 flex-wrap">
        <span class="pill pill-forest text-[9px]">现金</span>
        <span class="font-display" th:text="${h.displayName}">USD 现金</span>
        <span class="font-mono text-[10px] text-ink-subtle"
              th:text="'现 ' + ${h.currency} + ' ' + ${#numbers.formatDecimal(h.manualValue,1,2)}">现 $1,200</span>
      </div>
      <form th:action="@{/entry/income}" method="post" class="flex flex-wrap items-end gap-2">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <input type="hidden" name="periodId" th:value="${period.id}">
        <input type="hidden" name="accountId" th:value="${account.id}">
        <input type="hidden" name="categoryCode" value="dividend">
        <div>
          <label class="font-mono text-[9px] uppercase text-ink-subtle mb-1 block"
                 th:text="'+ 现金到账(' + ${account.currency} + ')· 股息/利息'">+ 现金到账 · 股息/利息</label>
          <input name="amount" type="number" step="0.01" min="0.01" required placeholder="600"
                 class="w-28 font-mono bg-paper border border-rule px-3 py-2 tnum text-right">
        </div>
        <div class="flex-1 min-w-[120px]">
          <label class="font-mono text-[9px] uppercase text-ink-subtle mb-1 block">备注(选填)</label>
          <input name="note" maxlength="60" placeholder="如 阿里分红"
                 class="w-full font-mono text-xs bg-paper border border-rule px-3 py-2">
        </div>
        <button type="submit" class="btn-ink text-sm">+ 入账</button>
      </form>
    </div>
  </div>

  <!--/* 新建持仓入账:上市 / 未上市 */-->
  <div class="grid grid-cols-1 md:grid-cols-2 gap-3 pt-1">
    <div class="border border-dashed border-rule bg-card-soft px-4 py-3">
      <div class="font-mono text-[10px] uppercase text-ink-subtle mb-2">新建上市持仓入账 · 首次拿到某票</div>
      <form th:action="@{/entry/income/stock/new-auto}" method="post" class="flex flex-wrap items-end gap-2">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <input type="hidden" name="periodId" th:value="${period.id}">
        <input type="hidden" name="accountId" th:value="${account.id}">
        <input type="hidden" name="categoryCode" value="stock_salary">
        <div><label class="font-mono text-[9px] uppercase text-ink-subtle mb-1 block">代码</label>
          <input name="ticker" required placeholder="TSLA" class="w-20 font-mono text-xs bg-paper border border-rule px-2 py-2"></div>
        <div><label class="font-mono text-[9px] uppercase text-ink-subtle mb-1 block">市场</label>
          <select name="market" class="font-mono text-xs bg-paper border border-rule px-2 py-2">
            <option th:each="m : ${markets}" th:value="${m}" th:text="${m}">US</option>
          </select></div>
        <div><label class="font-mono text-[9px] uppercase text-ink-subtle mb-1 block">股数</label>
          <input name="shares" type="number" step="0.0001" min="0.0001" required placeholder="10"
                 class="w-20 font-mono text-xs bg-paper border border-rule px-2 py-2 tnum text-right"></div>
        <button type="submit" class="btn-paper text-xs">+ 建仓入账</button>
      </form>
      <p class="font-mono text-[9px] text-ink-subtle mt-1">按最新已知价计值 · 无价请先在持仓页刷价</p>
    </div>

    <div class="border border-dashed border-rule bg-card-soft px-4 py-3">
      <div class="font-mono text-[10px] uppercase text-rust mb-2">新建未上市持仓入账 · 如字节 RSU</div>
      <form th:action="@{/entry/income/stock/new-manual}" method="post" class="flex flex-wrap items-end gap-2">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <input type="hidden" name="periodId" th:value="${period.id}">
        <input type="hidden" name="accountId" th:value="${account.id}">
        <input type="hidden" name="categoryCode" value="stock_salary">
        <div class="flex-1 min-w-[100px]"><label class="font-mono text-[9px] uppercase text-ink-subtle mb-1 block">名称</label>
          <input name="displayName" required placeholder="字节 RSU" class="w-full font-mono text-xs bg-paper border border-rule px-2 py-2"></div>
        <div><label class="font-mono text-[9px] uppercase text-ink-subtle mb-1 block">股数</label>
          <input name="shares" type="number" step="0.0001" min="0.0001" required placeholder="250"
                 class="w-20 font-mono text-xs bg-paper border border-rule px-2 py-2 tnum text-right"></div>
        <div><label class="font-mono text-[9px] uppercase text-ink-subtle mb-1 block"
                    th:text="'单股(' + ${account.currency} + ')'">单股(¥)</label>
          <input name="unitValue" type="number" step="0.01" min="0" required placeholder="240"
                 class="w-20 font-mono text-xs bg-paper border border-rule px-2 py-2 tnum text-right"></div>
        <button type="submit" class="btn-paper text-xs">+ 建仓入账</button>
      </form>
      <p class="font-mono text-[9px] text-ink-subtle mt-1">市值 = 股数 × 单股估值(手填)</p>
    </div>
  </div>

</div>
</body>
</html>

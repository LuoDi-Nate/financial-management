<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('财务目标 · 家庭账房')}"></head>
<body class="min-h-screen relative">
<div class="fixed top-0 left-0 right-0 h-1 bg-ink z-40"></div>
<header th:replace="~{fragments/nav :: nav('goals', ${me}, ${nav})}"></header>

<main class="max-w-[1400px] mx-auto px-4 sm:px-6 lg:px-10 py-5 sm:py-10 relative z-10">

  <!-- 标题 + 操作 -->
  <div class="flex items-end justify-between mb-8 flex-wrap gap-4">
    <div>
      <div class="eyebrow mb-2">目 · 标 · 追 · 踪</div>
      <h1 class="font-display text-4xl md:text-5xl font-medium tracking-tight">财务目标</h1>
      <p class="font-serif text-sm text-ink-soft mt-3 max-w-2xl">
        预设三类(退休/教育/应急)三情景预测达成日;自定义追踪目标绑账户、选指标、设期限,带倒计时与进度落后提醒。
      </p>
    </div>
    <!-- v1.6 review B7-1 · 空状态时隐藏(卡内已有 4 个更具体的入口,且两个 btn-ink 破坏主操作唯一性) -->
    <a th:href="@{/goals/new}" th:unless="${#lists.isEmpty(goals)}" class="btn-ink no-underline">+ 新建目标</a>
  </div>

  <!-- 空状态 · 无目标时 -->
  <div th:if="${#lists.isEmpty(goals)}" class="paper-card p-8 text-center mx-auto" style="max-width:640px">
    <div class="font-display text-2xl mb-2">还没有目标</div>
    <p class="text-ink-soft mb-6">你的家庭在朝哪儿走?设定第一个目标开始。</p>
    <!-- v1.6 review B7-2/B7-3 · 等宽 2×2 网格(按钮宽度不再随文字长度变化)+ FIRE 补中文 -->
    <div class="grid grid-cols-2 gap-3">
      <a th:href="@{/goals/new/retirement}" class="btn-paper no-underline justify-center">+ 退休 / 提前退休</a>
      <a th:href="@{/goals/new/education}" class="btn-paper no-underline justify-center">+ 子女教育金</a>
      <a th:href="@{/goals/new/emergency}" class="btn-paper no-underline justify-center">+ 应急储备</a>
      <a th:href="@{/goals/new/custom}" class="btn-ink no-underline justify-center">+ 自定义追踪</a>
    </div>
  </div>

  <!-- 目标紧凑条(列表 · 一屏多条 · 点开进详情)· v0.16 移动端瘦身 -->
  <div class="max-w-3xl" th:unless="${#lists.isEmpty(goals)}">
    <p class="text-xs text-ink-soft mb-4">各目标独立估算,同一笔家庭结余尚未在目标之间分配。</p>
    <th:block th:each="gp : ${goals}">
      <div th:replace="~{goals/_goal-bar :: bar(${gp})}"></div>
    </th:block>
  </div>

</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>

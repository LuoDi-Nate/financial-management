<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<body>
  <!-- v0.3 FR-53b · AI 月报 · v0.5.4 加锚点 id=ai-report(dashboard 目标条带「AI 阅读总结」直达)+ 重新生成 -->
  <section id="ai-report" class="paper-card mb-6 overflow-hidden" style="border-left:4px solid var(--brass-deep);scroll-margin-top:80px" th:fragment="report">
    <details th:open="${aiMonthlyReport != null || reportError != null || reportNote != null}">
      <summary class="px-6 py-4 flex flex-wrap items-center gap-3 cursor-pointer hover:bg-card-soft list-none border-b border-rule-soft">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--brass-deep);flex-shrink:0">
          <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
        </svg>
        <div class="flex-1 min-w-0">
          <div class="font-mono text-[10px] tracking-[0.18em] uppercase text-brass-deep">AI · 综 · 合 · 月 · 报</div>
          <div class="font-display text-lg font-medium" th:text="${aiMonthlyReport != null ? '本期周期叙事' : '本期 AI 月报尚未生成'}">本期周期叙事</div>
        </div>
        <span class="w-full pl-8 sm:w-auto sm:pl-0 font-mono text-[10px] text-ink-subtle"
              data-goal-report-time
              th:if="${aiMonthlyReport != null}"
              th:text="'本期复用 · 渲染于 ' + ${#temporals.format(aiMonthlyReport.generatedAt, 'yyyy-MM-dd HH:mm')}">本期复用 · 渲染于 2026-05-12</span>
      </summary>
      <div class="px-6 py-5 text-sm text-ink-soft leading-relaxed font-serif">
        <p th:if="${reportError != null}" role="alert" class="text-rust mb-3" th:text="${reportError}"></p>
        <p th:if="${reportNote != null}" role="status" class="text-forest mb-3" th:text="${reportNote}"></p>
        <th:block th:if="${aiMonthlyReport != null}">
          <!--/* v1.28 · >_ 放在正文这边:放在 <summary> 里会让「点图标」同时折叠整张卡 */-->
          <div class="flex justify-end -mt-1 mb-2" data-peek-host>
            <th:block th:replace="~{fragments/_prompt-peek :: btn(${reportPeekSrc})}"></th:block>
          </div>
          <p th:if="${reportStale == true}" class="text-sm text-brass-deep mb-2">计划、资金或月结余依据已变化,以下为历史解读。</p>
          <p class="text-xs text-ink-soft break-words mb-2" th:text="${reportSourceLabel}"></p>
          <p th:if="${reportSourceStale == true}" class="text-sm text-brass-deep mb-2">模型服务或选型已变更,这是保留的历史解读。</p>
          <p class="whitespace-pre-line" th:utext="${@aiText.priv(aiMonthlyReport.content)}">月报内容...</p>
          <!-- v0.5.4 · 复用已生成月报(缓存)· 需要时可重新生成(同 checkup AI 诊断 ↻ 语义) -->
          <form th:action="@{|/goals/${goal.id}/report/generate|}" method="post" class="mt-4 pt-3 border-t border-rule-soft">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button type="submit" class="btn-ghost text-[11px] inline-flex items-center gap-1.5"
                    style="color:var(--brass-deep)">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
              </svg>
              重新生成
            </button>
          </form>
        </th:block>
        <div th:if="${aiMonthlyReport == null}">
          <p class="text-ink-subtle mb-4">周期关闭时系统会自动生成月报，也可立即手动触发。</p>
          <form th:action="@{|/goals/${goal.id}/report/generate|}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button type="submit" class="btn-paper btn-accent text-xs">
              立即生成月报
            </button>
          </form>
        </div>
      </div>
    </details>
    <script defer th:src="@{/js/goal-report.js(v=${buildVersion})}"></script>
  </section>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<body>
<!--
  v0.3 FR-50d · Dashboard 顶部目标进度条带 fragment
  · 高度 ≤ 100px · 灰底低视觉权重 · 不打扰 KPI 卡
  · 无目标 → 显引导卡(不显空条带)
  · 失败容忍:Controller try-catch 后传 List.of() · 此处直接 hide
-->
<section th:fragment="strip(goals)" th:if="${goals != null and !#lists.isEmpty(goals)}"
         class="mb-6 border border-rule" style="background:var(--paper-soft)">
  <div class="px-3 py-3 sm:px-6 sm:py-4">
    <div class="flex items-baseline justify-between mb-3">
      <div class="flex items-center gap-3">
        <span class="font-mono text-[10px] tracking-[0.18em] uppercase text-brass-deep">财 · 务 · 目 · 标</span>
        <!-- v1.18.7 · 原文案「本期 · 周期关闭后刷新」说的不是这个数的口径。
             目标进度 = 家庭净资产 ÷ 目标值,而目标值是【以本位币存的绝对金额】、目标本身是【全家庭】的,
             所以它既不随视图币种走、也不随账户筛选走,而且是【此刻】而非某个历史账期。
             这个口径本来就和上面的 KPI 不同 —— 与其悄悄不一致,不如公开地不一致。 -->
        <span class="text-xs text-ink-subtle">当前计划 · 本位币 · 此刻</span>
        <span th:if="${goalsViewIndependent}" class="font-mono text-[10px] text-brass-deep"
              title="金额以本位币保存、范围按各自目标计划,这一条不随上方币种/账户/账期筛选变化">
          · 不随上方筛选变化</span>
      </div>
      <a th:href="@{/goals}" class="font-mono text-[10px] tracking-[0.18em] uppercase text-brass-deep hover:text-ink no-underline">→ 完整看板</a>
    </div>

    <!-- 2026-07-19 评审:移动保持两列提密度(外/内边距收窄腾格宽),底行允许换行不溢出 -->
    <div class="grid grid-cols-2 md:grid-cols-3 gap-1.5 sm:gap-2">
      <!-- v0.5.4 · 每个目标 = 主卡链接 + 右侧「AI 阅读总结」小入口(直达本期月报锚点)· 两个并列 <a> 不嵌套 -->
      <div th:each="gp, gpStat : ${goals}"
           th:classappend="${gpStat.index >= 2} ? 'hidden md:flex' : 'flex'"
           class="items-stretch border border-rule-soft hover:bg-paper transition group">
        <a th:href="@{|/goals/${gp.goal.id}|}"
           class="flex items-center gap-2 px-2 py-1.5 sm:gap-2.5 sm:px-3 sm:py-2 flex-1 min-w-0 no-underline">
          <span class="w-2 h-2 rounded-full flex-shrink-0"
                th:style="${gp.goal.goalType.name() == 'EMERGENCY' ? 'background:var(--forest)'
                                                                  : (gp.goal.goalType.name() == 'EDUCATION' ? 'background:var(--rust)'
                                                                  : (gp.goal.goalType.name() == 'CUSTOM' ? 'background:var(--brass)' : 'background:var(--brass-deep)'))}"></span>
          <div class="flex-1 min-w-0">
            <div class="flex items-center gap-1">
              <span class="text-sm text-ink truncate group-hover:text-brass-deep transition" th:text="${gp.goal.name}">退休</span>
              <!-- 2026-07-19:ⓘ 换 kpi-info 组件 —— 点击弹描述(stopPropagation,不再误跳目标详情);热区随全局扩大 -->
              <th:block th:insert="~{fragments/_kpi-info :: i(${gp.goal.description != null and !gp.goal.description.isBlank() ? gp.goal.description : gp.goal.name}, null)}"/>
              <span class="font-mono text-xs text-ink-subtle ml-auto" style="max-width:50%;text-align:right" th:text="${gp.progressLabel()}">57.0%</span>
            </div>
            <div class="w-full bg-card-soft h-1.5 mt-1 overflow-hidden">
              <div class="h-full bg-brass-deep"
                   th:style="'width:' + ${gp.progressPct > 100 ? 100 : (gp.progressPct < 0 ? 0 : gp.progressPct)} + '%'"></div>
            </div>
            <!-- 当前/目标(万/%缩写 · data-priv)+ 时间 · 一行分居左右不换行 -->
            <div class="flex items-baseline justify-between gap-x-2 flex-wrap mt-0.5 font-mono text-[9px] text-ink-subtle">
              <span data-priv th:text="${gp.currentDisp()} + ' / ' + ${gp.targetDisp()}">15/50万</span>
              <span th:if="${gp.isNewRetirement()}" th:text="${'当前退休计划 · 修订'+gp.retirement.plan.version}">当前退休计划</span>
              <span th:if="${!gp.isCustom() and gp.neutralDate != null}" th:text="'中性 ' + ${#temporals.format(gp.neutralDate, 'yyyy')}">中性 2053</span>
              <span th:if="${gp.isCustom() and gp.daysLeft != null}" th:text="'还剩 ' + ${gp.daysLeft} + ' 天'">还剩 145 天</span>
              <span th:if="${gp.isCustom() and gp.daysLeft == null}">长期</span>
            </div>
          </div>
        </a>
        <!-- AI洞察 · 所有目标(含自定义)· 手机隐藏,桌面显 -->
        <a th:href="@{|/goals/${gp.goal.id}#ai-report|}" title="AI 洞察 · 本目标 AI 综合月报"
           class="hidden md:flex flex-col items-center justify-center gap-1 px-3 border-l border-rule-soft text-ink-subtle hover:text-brass-deep hover:bg-card-soft no-underline flex-shrink-0">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
          </svg>
          <span class="text-[10px] leading-none whitespace-nowrap">AI洞察</span>
        </a>
      </div>
    </div>
    <!-- 手机端超 2 条 → 折叠为「查看全部」(桌面显全部)-->
    <div class="md:hidden text-center mt-3" th:if="${#lists.size(goals) > 2}">
      <a th:href="@{/goals}" class="font-mono text-[10px] tracking-[0.14em] uppercase text-brass-deep no-underline"
         th:text="'查看全部 ' + ${#lists.size(goals)} + ' 个目标 →'">查看全部</a>
    </div>
  </div>
</section>

<!-- 引导卡:无目标时 -->
<section th:fragment="emptyHint" th:if="${goals == null or #lists.isEmpty(goals)}"
         class="mb-6 paper-card p-5 bg-card-soft" style="border-left:4px solid var(--brass-deep)">
  <div class="flex items-center justify-between flex-wrap gap-3">
    <div>
      <div class="font-mono text-[10px] tracking-[0.18em] uppercase text-brass-deep mb-1">财 · 务 · 目 · 标 · 新</div>
      <p class="text-sm text-ink-soft">你的家庭朝哪儿走?设定第一个长期目标开始追踪进度。</p>
    </div>
    <a th:href="@{/goals/new}" class="btn-paper no-underline">+ 创建第一个目标</a>
  </div>
</section>
</body>
</html>

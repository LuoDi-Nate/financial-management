<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<!--
  Layout fragment · 公共骨架(Tailwind CDN + 三套字体 + 共享样式表)
  详见 TDD § 8.2
-->
<head th:fragment="head(title)">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="_csrf" th:content="${_csrf != null ? _csrf.token : ''}"/>
  <meta name="_csrf_header" th:content="${_csrf != null ? _csrf.headerName : 'X-XSRF-TOKEN'}"/>
  <title th:text="${title} ?: '家庭账房'">家庭账房</title>
  <!-- v0.11 隐私模式 · FOUC 防闪(决策 129):DOM 构建前据 sessionStorage 设 html.privacy,避免明文闪现 -->
  <script>try{if(sessionStorage.getItem('privacy')==='1')document.documentElement.classList.add('privacy');}catch(e){}</script>
  <!-- v1.2.2 字号档位 · FOUC 防闪(issue #7):DOM 构建前据 localStorage 设 html[data-fs],避免大字号闪一下再缩 -->
  <script>try{var _fs=localStorage.getItem('fontScale');if(_fs==='lg'||_fs==='xl')document.documentElement.setAttribute('data-fs',_fs);}catch(e){}</script>
  <!-- v0.2 FR-1/FR-34 · favicon 优先用户自定义 WebP,否则用预设(默认 icon2);apple-touch-icon 永远跟 family.logoPreset(WebP 不适合 iOS)
       BUG-FIX(2026-05-11):删 alternate icon SVG —— Chrome 见 SVG 备选会优先选 SVG(矢量任意 DPI 都清晰),
       把我们的 PNG 预设跳过去。只保留 PNG + 显式 sizes,Chrome 会按 DPI 选最大那张 (192/512)。 -->
  <th:block th:with="preset=${nav != null and nav.family != null and nav.family.logoPreset != null ? nav.family.logoPreset : 'icon2'}">
    <link rel="icon" sizes="192x192"
          th:href="${nav != null and nav.family != null and nav.family.logoPath != null} ? @{|/uploads/${nav.family.logoPath}|} : @{/img/presets/{p}-192.png(p=${preset},v=${buildVersion})}">
    <link rel="icon" sizes="512x512"
          th:href="${nav != null and nav.family != null and nav.family.logoPath != null} ? @{|/uploads/${nav.family.logoPath}|} : @{/img/presets/{p}-512.png(p=${preset},v=${buildVersion})}">
    <link rel="apple-touch-icon" sizes="180x180"
          th:href="@{/img/presets/{p}-180.png(p=${preset},v=${buildVersion})}">
  </th:block>
  <link rel="manifest" th:href="@{/manifest.webmanifest(v=${buildVersion})}">
  <meta name="theme-color" content="#1a1714">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="账房">
  <!-- v1.6.7 · 窄屏判据的唯一出处 —— 必须与 tailwind screens / style.css 的 @media 完全同源。
       图表脚本里原有 22 处硬编码 `window.innerWidth` 宽度比较,手机横屏(844×390)会全部误判成宽屏
       → 字号/阈值/形态集体切换,这正是用户看到的「转手机图表也跟着变」。
       判据 = 宽度不足 **或** 短边不足 480;嵌套(横屏 iframe)是主动要的宽屏视图 → 只看宽度。 -->
  <script>window.vpNarrow=function(w){w=w||768;
    /* 横屏模式(ls-wide):布局宽度被锁成屏幕**长边**,而 innerWidth 仍是短边 → 按长边判 */
    if(document.documentElement.classList.contains('ls-wide'))
      return Math.max(window.innerWidth,window.innerHeight)<w;
    return window.innerWidth<w||window.innerHeight<480;};</script>
  <link rel="stylesheet" th:href="@{/css/style.css(v=${buildVersion})}">
  <script th:src="@{/vendor/tailwind.js(v=${buildVersion})}"></script>
  <script th:src="@{/vendor/htmx.min.js(v=${buildVersion})}"></script>
  <!-- v0.2.1 · 搜索式下拉(任何 <select data-searchable> 自动升级) -->
  <script th:src="@{/js/searchable-select.js(v=${buildVersion})}" defer></script>
  <!-- v0.4.13 · KPI 口径说明 tooltip(点击 ? 展开说明) -->
  <script th:src="@{/js/kpi-info.js(v=${buildVersion})}" defer></script>
  <script th:src="@{/js/account-group-toggle.js(v=${buildVersion})}" defer></script>  <!--/* v1.20 · 账户组行展开(dashboard + reports 共用) */-->
  <script th:inline="javascript">
    /* v1.6.7 · 断点必须同时看「短边」,不能只看宽度 ————————————————————————
       手机横屏是 844×390:只判宽度 → 844 被当成宽屏设备 → 模板里 453 处
       sm:/md:/lg: 集体切到宽屏分支,这就是用户看到的「一转手机页面就变了」。
       真正的判据是短边:iPhone 横屏 innerHeight ≤ 440(最大的 16 Pro Max 短边 440),
       而 PC 窗口极少矮于 480 → 阈值取 480,一处改动纠正全部 453 处。
       例外:横屏 iframe(844×390)是用户主动点出来的宽屏视图,走「只看宽度」那一套。 */
    var TW_EMBEDDED = false;
    try { TW_EMBEDDED = window.self !== window.top; } catch (e) { TW_EMBEDDED = true; }
    var bp = function (w) {
      return TW_EMBEDDED ? { raw: '(min-width: ' + w + 'px)' }
                         : { raw: '(min-width: ' + w + 'px) and (min-height: 480px)' };
    };
    /* v1.6.15 · 断点基线暴露成全局:横屏模式要**原地**换断点(不再靠 iframe 重载整页),
       换完还得换回来,所以基线只能有一处出处 —— 见 static/js/landscape.js。 */
    window.TW_SCREENS_BASE = { sm: bp(640), md: bp(768), lg: bp(1024), xl: bp(1280), '2xl': bp(1536) };
    /* v1.6.18 · 横屏要跨页面保持(用户:点账户详情跳过去就变回竖屏了)。
       与隐私模式的 FOUC 防闪同一手法:在**首次编译之前**就据 sessionStorage 决定用哪档断点,
       并把 html.ls-wide 贴上 —— 否则新页面会先按竖屏排一遍再被 JS 扳过去,闪一下。 */
    window.TW_SCREENS_WIDE = { sm: { raw: '(min-width: 1px)' }, md: { raw: '(min-width: 1px)' },
                               lg: bp(1024), xl: bp(1280), '2xl': bp(1536) };
    var LS_KEEP = false;
    try { LS_KEEP = sessionStorage.getItem('lsWide') === '1'; } catch (e) {}
    if (LS_KEEP) document.documentElement.classList.add('ls-wide');
    tailwind.config = {
      theme: {
        screens: LS_KEEP ? window.TW_SCREENS_WIDE : window.TW_SCREENS_BASE,
        extend: {
          colors: {
            paper: 'var(--paper)', 'paper-soft': 'var(--paper-soft)', 'paper-deep': 'var(--paper-deep)',
            card: 'var(--card)', 'card-soft': 'var(--card-soft)',
            ink: { DEFAULT: 'var(--ink)', soft: 'var(--ink-soft)', subtle: 'var(--ink-subtle)' },
            rule: { DEFAULT: 'var(--rule)', soft: 'var(--rule-soft)' },
            brass: { DEFAULT: 'var(--brass)', deep: 'var(--brass-deep)', soft: 'var(--brass-soft)' },
            forest: 'var(--forest)', rust: 'var(--rust)'
          },
          fontFamily: {
            display: ['Fraunces', 'Noto Serif SC', 'serif'],
            serif:   ['"Source Serif 4"', 'Noto Serif SC', 'serif'],
            mono:    ['JetBrains Mono', 'monospace']
          }
        }
      }
    };
    window.TW_EXTEND_BASE = tailwind.config.theme.extend;
  </script>
  <script>
    document.addEventListener('htmx:configRequest', function (event) {
      const token = document.querySelector('meta[name="_csrf"]')?.content;
      const header = document.querySelector('meta[name="_csrf_header"]')?.content;
      if (token && header) event.detail.headers[header] = token;
    });
  </script>
  <!-- v0.11 隐私模式 · 样式 + 全局切换(决策 126/127/130/131)。
       绝对金额带 data-priv → html.privacy 下高斯模糊 + 不可选中复制;比例/% 不带标记不受影响。
       两入口(nav + 浮动)都只 toggle html.privacy → 眼睛 eye/eye-off 纯 CSS 跟随,零 JS 同步。 -->
  <style>
    html.privacy [data-priv]{ filter:blur(7px); -webkit-filter:blur(7px); user-select:none; -webkit-user-select:none; cursor:pointer; -webkit-touch-callout:none; }
    /* iOS PWA 修:长按被遮金额会触发其外层 <a> 的「链接预览」小窗 → 隐私态关掉链接的 touch-callout(不影响轻点跳转)*/
    html.privacy a, html.privacy a *{ -webkit-touch-callout:none; }
    /* 按住临时查看(peek):按住时去模糊,松开复原。更具体选择器 → 无需 !important */
    html.privacy [data-priv].priv-peek{ filter:none; -webkit-filter:none; }
    .priv-eye-off{ display:none; } html.privacy .priv-eye-on{ display:none; } html.privacy .priv-eye-off{ display:inline-flex; }
    /* v1.6 UED · 浮钮从左下改右下(左下是内容起始边,曾压住 dashboard 金额/图表标签/筛选行 · review A1)
       + iOS home indicator 安全区 + 滚动中淡出(不挡阅读),停止滚动后恢复 */
    #priv-float{ position:fixed; right:14px; bottom:max(18px, env(safe-area-inset-bottom)); z-index:9999;
      display:inline-flex; align-items:center; gap:6px;
      background:var(--card); color:var(--ink-soft); border:1px solid var(--rule); border-radius:999px; padding:8px 11px;
      box-shadow:0 3px 12px rgba(0,0,0,.16); cursor:pointer; font-family:"JetBrains Mono",monospace; font-size:11px; letter-spacing:.04em;
      transition:opacity .25s ease, border-color .18s ease;
      /* v1.6 UED review A1(二次修正)· 移到右下后会压住右对齐的金额(列表卡「本期末 ¥10,000」)。
         浮钮是常驻控件、不是内容,默认半透明让下方数字仍可读;交互时恢复不透明。 */
      opacity:.62; }
    #priv-float:hover, #priv-float:active, #priv-float:focus-visible{ border-color:var(--ink-soft); opacity:1; }
    html.privacy #priv-float{ opacity:1; }   /* 隐私态是「当前状态提示」,必须清晰可见 */
    .toc-fab{ opacity:.62; }
    .toc-fab:hover, .toc-fab:active, .toc-fab:focus-visible{ opacity:1; }
    body.is-scrolling #priv-float, body.is-scrolling .toc-fab{ opacity:.22; }
    #priv-float .priv-float-label{ display:none; white-space:nowrap; }
    html.privacy #priv-float{ background:var(--brass-soft); color:var(--brass-deep); border-color:var(--brass); }
    html.privacy #priv-float .priv-float-label{ display:inline; }
  </style>
  <script>
    function togglePrivacy(){
      var on = document.documentElement.classList.toggle('privacy');
      try{ sessionStorage.setItem('privacy', on ? '1' : '0'); }catch(e){}
      // 图表金额标签随隐私态重绘(formatter 内用 window.isPrivacy() 判断);形状不动
      try{ document.querySelectorAll('canvas').forEach(function(c){ var ch=(window.Chart&&Chart.getChart)?Chart.getChart(c):null; if(ch) ch.update('none'); }); }catch(e){}
    }
    window.togglePrivacy = togglePrivacy;
    window.isPrivacy = function(){ return document.documentElement.classList.contains('privacy'); };

    // v1.2.2 · 全局字号档位(issue #7)。CSS 靠 --fs-scale 缩放文字;图表 canvas 字号在 JS 里读 chartFont() 缩放。
    window.FS_STEPS = { std: 1, lg: 1.15, xl: 1.30 };
    window.currentFontScale = function(){ return document.documentElement.getAttribute('data-fs') || 'std'; };
    window.appFontScale = function(){ return window.FS_STEPS[window.currentFontScale()] || 1; };
    window.chartFont = function(base){ return Math.round(base * window.appFontScale()); };
    function syncFsButtons(lv){
      document.querySelectorAll('[data-fs-opt]').forEach(function(b){
        b.setAttribute('aria-pressed', b.getAttribute('data-fs-opt') === lv ? 'true' : 'false'); });
    }
    window.setFontScale = function(lv){
      if(!window.FS_STEPS[lv]) lv = 'std';
      if(lv === 'std') document.documentElement.removeAttribute('data-fs');
      else document.documentElement.setAttribute('data-fs', lv);
      try{ localStorage.setItem('fontScale', lv); }catch(e){}
      syncFsButtons(lv);
      // 图表跟随:通知各图表页按新档重绘(监听 fontscalechange;canvas 字号 CSS 够不到)
      try{ window.dispatchEvent(new Event('fontscalechange')); }catch(e){}
    };
    // 载入时把控件高亮同步到已生效的档位(FOUC 脚本已设好 data-fs)
    document.addEventListener('DOMContentLoaded', function(){ syncFsButtons(window.currentFontScale()); });
    // v0.11 · 按住临时查看(peek):隐私态下「长按」某个被遮金额 → 临时显示,松开/滑走/滚动/失焦 → 复原。
    //   多数金额在 <a> 链接内(KPI 跳 /checkup、账户行跳详情),故:短按=正常跳转(数字仍隐藏);
    //   长按(≥阈值)=peek 显示 + 抑制松手那一次 click(不跳转)。事件委托覆盖 HTMX 片段。
    (function () {
      var HOLD_MS = 320, MOVE_TOL = 10;
      var peeking = null, timer = null, didPeek = false, suppressClick = false, sx = 0, sy = 0;
      function clearTimer() { if (timer) { clearTimeout(timer); timer = null; } }
      function endPeek() { clearTimer(); if (peeking) { peeking.classList.remove('priv-peek'); peeking = null; } }
      document.addEventListener('pointerdown', function (e) {
        suppressClick = false; didPeek = false; clearTimer();
        if (!document.documentElement.classList.contains('privacy')) return;
        var el = e.target.closest ? e.target.closest('[data-priv]') : null;
        if (!el) return;
        sx = e.clientX; sy = e.clientY;
        // 不在 pointerdown preventDefault(否则短按无法跳转 + 阻断滚动);靠 CSS user-select/-webkit-touch-callout 防选中
        timer = setTimeout(function () { el.classList.add('priv-peek'); peeking = el; didPeek = true; }, HOLD_MS);
      }, { passive: true });
      document.addEventListener('pointermove', function (e) {
        // 移动超过容差(滚动/滑走)→ 取消长按计时与 peek,放行滚动与短按语义
        if (Math.abs(e.clientX - sx) > MOVE_TOL || Math.abs(e.clientY - sy) > MOVE_TOL) endPeek();
      }, { passive: true });
      function up() { if (didPeek) suppressClick = true; endPeek(); }
      document.addEventListener('pointerup', up);
      document.addEventListener('pointercancel', endPeek);
      document.addEventListener('scroll', endPeek, true);
      window.addEventListener('blur', endPeek);
      // 长按 peek 后,抑制随之而来的 click(阻止 <a> 跳转);短按不触发,正常跳转
      document.addEventListener('click', function (e) {
        if (suppressClick) { suppressClick = false; e.preventDefault(); e.stopPropagation(); }
      }, true);
      // 防御:隐私态下被遮金额上的 contextmenu(桌面右键/部分浏览器长按菜单)一并拦掉(iOS 链接预览由 CSS callout:none 处理)
      document.addEventListener('contextmenu', function (e) {
        if (!document.documentElement.classList.contains('privacy')) return;
        if (e.target.closest && e.target.closest('[data-priv]')) e.preventDefault();
      }, true);
    })();
    // v1.6 UED(review A1)· 滚动中把右下浮钮淡出,停止 650ms 后恢复 —— 长页阅读时不挡内容
    (function () {
      var t = null;
      window.addEventListener('scroll', function () {
        document.body.classList.add('is-scrolling');
        if (t) clearTimeout(t);
        t = setTimeout(function () { document.body.classList.remove('is-scrolling'); }, 650);
      }, { passive: true });
    })();
    // v1.6 UED(review A4)· 窄屏收起分析页顶部的口径折叠条(PC ≥768 恒展开 · summary 由 CSS 隐藏)。
    // HTMX 换入的区块也要处理 —— 用户刚改完口径,应当直接看结果而不是又对着一屏控件。
    (function () {
      function fold(scope) {
        if (!vpNarrow(768)) return;
        (scope || document).querySelectorAll('details.filter-fold').forEach(function (d) { d.open = false; });
      }
      document.addEventListener('DOMContentLoaded', function () { fold(document); });
      document.addEventListener('htmx:load', function (e) { fold(e.target); });
    })();
  </script>
  <!-- v0.2 全局错误兜底:HTMX 5xx / 网络错误 / JS 致命异常,统一 toast 反馈 -->
  <script>
    (function () {
      'use strict';

      function toast(msg, level) {
        // 复用现有 showToast 事件协议(detail = { message, level })
        document.body.dispatchEvent(new CustomEvent('showToast', {
          detail: { message: msg, level: level || 'error' },
          bubbles: true
        }));
      }

      // HTMX 服务器返回 4xx / 5xx
      document.addEventListener('htmx:responseError', function (e) {
        var xhr = e.detail.xhr;
        var status = xhr.status;
        var path = (e.detail.requestConfig && e.detail.requestConfig.path) || 'unknown';

        // 401 → 登录态过期,必须跳登录
        if (status === 401) {
          window.location.href = '/login?expired=1';
          return;
        }
        // 403 → CSRF 过期或权限,提示刷新
        if (status === 403) {
          toast('登录态可能已过期,请刷新页面后重试', 'error');
          return;
        }
        // 404 → 资源不存在
        if (status === 404) {
          toast('该数据不存在或已被删除', 'error');
          return;
        }
        // 4xx 其它 → ToastErrorAdvice 已通过 HX-Trigger=showToast 推送了具体消息;这里只兜底
        if (status >= 400 && status < 500) {
          // 业务异常通常已经 toast,如果没有 HX-Trigger,显示通用提示
          if (xhr.getResponseHeader && !xhr.getResponseHeader('HX-Trigger')) {
            toast('请求被拒绝(' + status + '),请检查后重试', 'error');
          }
          return;
        }
        // 5xx → 服务器错误:toast + 控制台留痕。不自动跳 /error(避免丢失填报现场)
        if (status >= 500) {
          toast('服务器繁忙(HTTP ' + status + ',' + path + '),请稍后再试。如反复出现请联系管理员', 'error');
          if (window.console) console.error('HTMX 5xx', status, path, xhr.responseText && xhr.responseText.slice(0, 500));
        }
      });

      // HTMX 网络层错误(请求未发出 / 超时)
      document.addEventListener('htmx:sendError', function () {
        toast('网络异常 — 请检查网络连接后重试', 'error');
      });

      // HTMX 超时
      document.addEventListener('htmx:timeout', function () {
        toast('请求超时 — 服务器响应慢,请稍后再试', 'error');
      });

      // JS 同步异常 — 仅 console,避免噪音(浏览器扩展 / 第三方脚本经常误触发)
      window.addEventListener('error', function (e) {
        // 过滤掉浏览器无关错误
        if (e.message && (
          e.message.indexOf('ResizeObserver') > -1 ||
          e.message.indexOf('Script error') > -1 ||
          e.message.indexOf('Non-Error promise rejection') > -1)) return;
        if (window.console) console.error('Window error:', e.message, 'at', e.filename + ':' + e.lineno);
      });

      // Promise rejection 未捕获
      window.addEventListener('unhandledrejection', function (e) {
        if (window.console) console.error('Unhandled rejection:', e.reason);
      });
    })();
  </script>
  <!-- 全局加载进度条 + 印章式启动遮罩(早注入,首屏即生效) -->
  <style>
    /* 顶部 3px 渐变进度条 + 流动 shimmer 高光 */
    #page-progress {
      position: fixed; top: 0; left: 0; height: 3px; width: 0%;
      background: linear-gradient(90deg, var(--ink) 0%, var(--brass) 45%, var(--brass-deep) 65%, var(--rust) 100%);
      box-shadow: 0 0 12px rgba(167,123,53,0.6), 0 0 6px rgba(159,74,58,0.5), 0 1px 0 rgba(0,0,0,.05);
      z-index: 9999; transition: width .35s cubic-bezier(.22,.9,.22,1), opacity .25s ease;
      opacity: 1; pointer-events: none; overflow: hidden;
    }
    #page-progress::before {
      content: ""; position: absolute; inset: 0; transform: translateX(-100%);
      background: linear-gradient(90deg, transparent, rgba(255,250,240,.85), transparent);
      animation: pp-shimmer 1.4s linear infinite;
    }
    #page-progress.done { opacity: 0; }
    @keyframes pp-shimmer { from { transform: translateX(-100%); } to { transform: translateX(100%); } }

    /* 中央印章式启动遮罩 */
    #page-overlay {
      position: fixed; inset: 0; z-index: 9998; background: var(--paper);
      display: flex; align-items: center; justify-content: center;
      transition: opacity .55s cubic-bezier(.22,.9,.22,1), visibility .55s;
      opacity: 1; visibility: visible;
    }
    #page-overlay.hidden { opacity: 0; visibility: hidden; }
    #page-overlay::before {
      content: ""; position: absolute; inset: 0;
      background: radial-gradient(circle at 50% 45%, transparent 35%, rgba(26,23,20,.04) 70%);
      pointer-events: none;
    }
    #page-overlay .seal-stamp { position: relative; width: 140px; height: 140px; }
    #page-overlay .seal-stamp svg { width: 100%; height: 100%; overflow: visible; }
    #page-overlay .seal-ring-outer {
      fill: none; stroke: var(--ink); stroke-width: 2.5;
      stroke-dasharray: 360; stroke-dashoffset: 360;
      animation: seal-ring 1.6s cubic-bezier(.4,0,.2,1) infinite;
    }
    #page-overlay .seal-ring-inner {
      fill: none; stroke: var(--ink); stroke-width: 0.7; opacity: .7;
      stroke-dasharray: 320; stroke-dashoffset: 320;
      animation: seal-ring 1.6s cubic-bezier(.4,0,.2,1) infinite .15s;
    }
    #page-overlay .seal-fill {
      fill: var(--ink); opacity: 0; transform-origin: center;
      animation: seal-fill 1.6s ease-out infinite .4s;
    }
    #page-overlay .seal-character {
      fill: var(--brass);
      font-family: 'Fraunces', 'Noto Serif SC', serif;
      font-size: 60px; font-weight: 500;
      text-anchor: middle; dominant-baseline: central;
      opacity: 0;
      animation: seal-fade 1.6s ease-out infinite .55s;
    }
    #page-overlay .seal-ink-dot {
      fill: var(--rust); opacity: 0; transform-origin: center;
      animation: seal-pop 1.6s ease-out infinite .9s;
    }
    #page-overlay .seal-label {
      position: absolute; bottom: -42px; left: 50%; transform: translateX(-50%);
      font-family: 'Fraunces', 'Noto Serif SC', serif;
      font-size: 11px; letter-spacing: 0.45em; color: var(--ink-subtle);
      text-transform: uppercase; white-space: nowrap; opacity: 0;
      animation: seal-fade 1.6s ease-out infinite .8s;
    }
    #page-overlay .seal-pulse {
      position: absolute; inset: -20px; border-radius: 50%;
      border: 1px solid var(--brass); opacity: 0;
      animation: seal-wave 1.6s ease-out infinite 1.0s;
    }
    @keyframes seal-ring { 0% { stroke-dashoffset: 360; } 60%, 100% { stroke-dashoffset: 0; } }
    @keyframes seal-fill { 0%, 30% { opacity: 0; transform: scale(0); } 60%, 100% { opacity: 1; transform: scale(1); } }
    @keyframes seal-fade { 0%, 50% { opacity: 0; } 80%, 100% { opacity: 1; } }
    @keyframes seal-pop {
      0%, 50% { opacity: 0; transform: scale(0.3); }
      70% { opacity: 1; transform: scale(1.6); }
      90%, 100% { opacity: 1; transform: scale(1); }
    }
    @keyframes seal-wave { 0% { opacity: .8; transform: scale(.6); } 100% { opacity: 0; transform: scale(1.5); } }
    @keyframes toast-in { from { transform: translateY(-12px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  </style>
  <script>
    (function () {
      var SVG_NS = 'http://www.w3.org/2000/svg';
      function el(tag, attrs, parent) {
        var e = document.createElement(tag);
        if (attrs) for (var k in attrs) e.setAttribute(k, attrs[k]);
        if (parent) parent.appendChild(e);
        return e;
      }
      function svg(tag, attrs, parent) {
        var e = document.createElementNS(SVG_NS, tag);
        if (attrs) for (var k in attrs) e.setAttribute(k, attrs[k]);
        if (parent) parent.appendChild(e);
        return e;
      }

      // 顶部进度条
      var p = el('div', {id: 'page-progress'}, document.documentElement);
      requestAnimationFrame(function () { p.style.width = '30%'; });

      // 中央印章过渡
      var ov = el('div', {id: 'page-overlay'}, document.documentElement);
      var stamp = el('div', {class: 'seal-stamp'}, ov);
      el('div', {class: 'seal-pulse'}, stamp);
      var sv = svg('svg', {viewBox: '0 0 140 140'}, stamp);
      svg('rect', {class: 'seal-ring-outer', x: 14, y: 14, width: 112, height: 112, rx: 6}, sv);
      svg('rect', {class: 'seal-ring-inner', x: 22, y: 22, width:  96, height:  96, rx: 2}, sv);
      svg('rect', {class: 'seal-fill',       x: 30, y: 30, width:  80, height:  80, rx: 2}, sv);
      var ch = svg('text', {class: 'seal-character', x: 70, y: 73}, sv);
      ch.textContent = '账';
      svg('circle', {class: 'seal-ink-dot', cx: 118, cy: 22, r: 6}, sv);
      var lbl = el('div', {class: 'seal-label'}, stamp);
      lbl.textContent = '家 · 庭 · 账 · 房';

      /* v1.6.17 · 遮罩撤除不再挂在 window load 上 ————————————————————————
         用户反馈:「进入页面后右下角三个控制按钮不出现,等旭日下钻加载完才浮现」。
         根因就是这里:遮罩(z-index 9998)原本等 `load` —— 而 load 要等**所有子资源**
         (echarts / 图表脚本 / 图片),旭日重的页面能拖到两三秒,浮钮被压在遮罩下。
         系统级能力不该被页面内容的加载进度绑住,所以:
           · 遮罩改挂 DOMContentLoaded(结构就绪即可)+ 印章一个周期
           · 三个浮钮的 z-index 抬到遮罩之上(见 #float-dock),遮着也能点 */
      window.addEventListener('DOMContentLoaded', function () {
        p.style.width = '70%';
        setTimeout(function () { ov.classList.add('hidden'); }, 950);
      });
      window.addEventListener('load', function () {
        p.style.width = '100%';
        setTimeout(function () { p.classList.add('done'); }, 250);
        setTimeout(function () { p.style.width = '0%'; p.classList.remove('done'); }, 700);
        ov.classList.add('hidden');
      });
      // 兜底:DOMContentLoaded 也没来(解析被阻塞)最多遮 2.5s
      setTimeout(function () { ov.classList.add('hidden'); }, 2500);

      function rearm() { p.classList.remove('done'); p.style.width = '40%'; }
      document.addEventListener('click', function (e) {
        var a = e.target.closest('a');
        if (a && a.href && !a.target && !e.metaKey && !e.ctrlKey
            && !a.hasAttribute('hx-get') && !a.hasAttribute('hx-post')
            && !a.getAttribute('href').startsWith('#')) rearm();
      });
      document.addEventListener('submit', function (e) {
        if (!e.target.hasAttribute('hx-post')) rearm();
      });
      document.addEventListener('htmx:beforeRequest', rearm);
      document.addEventListener('htmx:afterRequest', function () {
        p.style.width = '100%';
        setTimeout(function () { p.classList.add('done'); }, 250);
        setTimeout(function () { p.style.width = '0%'; p.classList.remove('done'); }, 700);
      });
    })();
  </script>
  <!-- v1.6.2 · 横屏查看(全局 + 局部)· nav 入口在所有页面都要能用,故提为全站脚本 -->
  <script th:src="@{/js/landscape.js(v=${buildVersion})}" defer></script>
  <!-- v0.2 FR-33 / FR-34 · 移动端引导(微信内 + iOS Safari PWA) -->
  <script th:src="@{/js/mobile-guide.js(v=${buildVersion})}" defer></script>
</head>

  Footer fragment

<body>
<footer th:fragment="footer" class="border-t border-rule mt-12 py-6 px-8 text-center relative">
  <!-- v1.19 · 超级 Agent · PC 抽屉 + 悬浮入口(全站可用)

       为什么放 footer 而不是各页各写:用户在任何一页都可能想问「这个数怎么来的」,
       而那时候他正在看的那一页不该被顶掉 —— 抽屉盖在上面,底下那页留在原地。
       手机上悬浮球隐藏(屏幕小,会压住表格),走导航里的整页入口。
       nav 未加载(登录页/落地页)时整个不渲染:那些页面还没有 me,问什么都无从谈起。 -->
  <th:block th:if="${nav != null}">

           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
      </svg>
      <span>超级 Agent</span>
    </button>
    <aside class="ask-drawer" data-ask-drawer aria-label="超级 Agent">
      <div class="flex-1 min-h-0 flex flex-col" data-ask-drawer-body></div>
    </aside>
    <!--/*
         v1.19.6 · 手机上的「超级 Agent」浮钮 —— 与横屏 / 目录 / 隐私眼进同一个 #float-dock。

         此前手机上要点汉堡 → 展开 → 再点「超级 Agent」,**两步**;而横屏和隐私眼是一步。
         AI 问答是这个产品的三根支柱之一,不该比一个显示开关还难够到(用户原话:入口太深)。

         上面那个 .ask-fab 是**带文字的胶囊**,当初刻意在手机上隐藏(屏幕小,会压住表格)——
         那条判断没错,所以这里不是把它放出来,而是在 dock 里放一个**图标钮**:
         dock 本来就是为「不挡内容的常驻系统控件」设计的一列小圆钮。

         点它走整页 /ask 而不是抽屉:抽屉是 PC 的形态(同屏对照数据),窄屏放不下(FR-423)。
    */-->
    <a id="ask-float" th:href="@{/ask}" aria-label="超级 Agent · 用大白话问自己的账"
       title="超级 Agent · 用大白话问自己的账">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
      </svg>
    </a>
    <!-- 超级 Agent 的图表:Chart.js + datalabels(与全站其他图表同一份依赖,不另引)-->
    <script th:src="@{/vendor/chart.umd.min.js(v=${buildVersion})}" defer></script>
    <script th:src="@{/vendor/chartjs-plugin-datalabels.min.js(v=${buildVersion})}" defer></script>
    <script th:src="@{/js/ask-charts.js(v=${buildVersion})}" defer></script>
    <script th:src="@{/js/ask.js(v=${buildVersion})}" defer></script>
  </th:block>

  <!-- v1.17.1 · 终端命令块的一键复制(fragments/term :: cmd 用它)。
       放 footer 里 = 每个用 layout 的页面都有,不必各页各写一份。
       复制取每行的 textContent:行首那个 "$ " 提示符是 CSS ::before 画的、不属于 DOM 文本,
       所以不会被一起复制走(否则用户粘到终端就是一条带 $ 的跑不了的命令)。 -->
  <script th:inline="none">
    window.termCopy = function(btn){
      var box = btn.closest('.term-block'); if(!box) return;
      var text = Array.prototype.map.call(box.querySelectorAll('.t-line'), function(el){
        return el.textContent;
      }).join('\n');
      function done(ok){
        btn.textContent = ok ? '已复制' : '请手动选中';
        btn.classList.toggle('ok', ok);
        setTimeout(function(){ btn.textContent = '复制'; btn.classList.remove('ok'); }, 1800);
      }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(function(){ done(true); }, function(){ selectFallback(box); done(false); });
      } else {
        // 自托管常见:没挂 TLS,http 下 clipboard API 直接不可用 → 退回选中,用户自己 Ctrl+C
        selectFallback(box); done(false);
      }
      function selectFallback(b){
        var code = b.querySelector('.t-code'); if(!code) return;
        var r = document.createRange(); r.selectNodeContents(code);
        var sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
      }
    };
  </script>
  <div class="font-mono text-[10px] tracking-[0.18em] text-ink-subtle">
    家庭账房 · 仅限家庭内部使用
  </div>
  <!-- v0.11 隐私模式 · 常驻浮动控件(决策 131):任意滚动位置一键隐藏/恢复;隐私态展开成「金额已隐藏 · 点恢复」chip -->
  <button id="priv-float" type="button" onclick="togglePrivacy()" aria-label="隐藏 / 显示金额" title="隐藏金额(公共场合 / 分享)">
    <svg class="priv-eye-on" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
    <svg class="priv-eye-off" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
    <span class="priv-float-label">金额已隐藏 · 长按可看 · 点我恢复</span>
  </button>
  <!-- v1.6.4 用户反馈② · 方向切换做成右下浮钮,与隐私眼 / 目录钮同一列(顶级常驻控件)。
       方向只由这个钮决定 —— 转动手机不会改变页面方向(见 static/js/landscape.js)。 -->
  <!-- v1.6.17 · 三个系统浮钮统一进 #float-dock(flex 列)——
       原来各写死 bottom 偏移(18 / +48 / +96),哪个页面缺一个(如打标页没有目录钮)
       就在栈里留一个空洞(用户反馈④a)。改成 flex 列后,有几个排几个,不可能留空位。
       dock 的 z-index 高于首屏遮罩:系统能力不被页面加载进度绑住(反馈①/④b)。 -->
  <button id="ori-float" type="button" data-orientation-toggle aria-pressed="false"
          aria-label="切换横屏 / 竖屏" title="整页横屏查看(适合宽表格)· 转动手机不会改变方向">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="ori-ico-land"><path d="M2.5 10.5a1.8 1.8 0 0 1 1.8 -1.8h12.4a1.8 1.8 0 0 1 1.8 1.8v6.7a1.8 1.8 0 0 1 -1.8 1.8h-12.4a1.8 1.8 0 0 1 -1.8 -1.8z"/><path d="M17.2 13.2v1.3"/><path d="M6 14h-.01"/><path d="M15.5 5.4a6 6 0 0 1 5.9 5.1"/><path d="M13.6 6.9 15.6 5.3l1.5 2.1"/></svg><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="ori-ico-port"><path d="M6 5a2 2 0 0 1 2 -2h8a2 2 0 0 1 2 2v14a2 2 0 0 1 -2 2h-8a2 2 0 0 1 -2 -2v-14"/><path d="M11 4h2"/><path d="M12 17v.01"/></svg>
  </button>
  <!-- 全局 Toast 容器(HX-Trigger=showToast 触发) — 居中顶部,z-index 高于 nav 与 progress -->
  <div id="toast-stack"
       class="fixed top-6 left-1/2 -translate-x-1/2 z-[10000] flex flex-col items-center space-y-2 pointer-events-none w-auto max-w-[90vw]"></div>
  <script>
    (function () {
      function showToast(detail) {
        const msg = (detail && detail.message) || '操作完成';
        const level = (detail && detail.level) || 'info';
        const el = document.createElement('div');
        const palette = {
          error: 'bg-rust text-paper border-rust',
          warn:  'bg-brass text-ink border-brass-deep',
          info:  'bg-ink text-paper border-ink',
          success: 'bg-forest text-paper border-forest'
        };
        el.className = 'pointer-events-auto px-5 py-3 border-2 shadow-2xl max-w-md font-mono text-sm rounded ' + (palette[level] || palette.info);
        el.style.animation = 'toast-in .3s cubic-bezier(.22,.9,.22,1)';
        el.textContent = msg;
        const stack = document.getElementById('toast-stack');
        if (stack) {
          stack.appendChild(el);
          setTimeout(() => { el.style.transition = 'opacity .4s'; el.style.opacity = '0'; }, 4000);
          setTimeout(() => el.remove(), 4500);
        }
      }
      document.body.addEventListener('showToast', function (evt) { showToast(evt.detail); });
      window.showToast = showToast;
    })();
  </script>
  <!-- 条件必填:<input data-require-when="控件名=值"> —— 同表单内名为「控件名」的控件当前值 == 值 时,该字段才 required。
       radio 取 :checked 的 value;checkbox 勾选→其 value(默认 'true')未勾→'false';其它取 .value。
       原生 required 由浏览器/HTMX 拦截提交。HTMX 换入的片段经 htmx:load 再绑(本站条件字段均为整页表单,绑定是冗余保险)。 -->
  <script>
    (function () {
      function curVal(form, name) {
        var r = form.querySelector('input[type="radio"][name="' + name + '"]:checked');
        if (r) return r.value;
        var c = form.querySelector('input[type="checkbox"][name="' + name + '"]');
        if (c) return c.checked ? (c.value || 'true') : 'false';
        var any = form.querySelector('[name="' + name + '"]');
        return any ? any.value : null;
      }
      function wire(scope) {
        (scope || document).querySelectorAll('[data-require-when]').forEach(function (el) {
          if (el.__rqwWired) return; el.__rqwWired = true;
          var spec = el.getAttribute('data-require-when').split('=');
          var name = spec[0], want = spec.slice(1).join('=');
          var form = el.closest('form'); if (!form) return;
          function sync() { el.required = (curVal(form, name) === want); }
          form.querySelectorAll('[name="' + name + '"]').forEach(function (ctrl) {
            ctrl.addEventListener('change', sync);
          });
          sync();
        });
      }
      document.addEventListener('DOMContentLoaded', function () { wire(document); });
      if (document.body) document.body.addEventListener('htmx:load', function (e) { wire(e.target); });
    })();
  </script>
  <!-- v0.4.17 · 520 一日限定彩蛋 · 服务器时区 Asia/Shanghai 仅 05-20 注入 · 详 prd §21 -->
  <th:block th:replace="~{fragments/easter520 :: easter520(${nav != null ? nav.family : null})}"></th:block>
  <!-- v1.9.2 · 「有新版」弹窗 · 挂在 footer(body 层)而不是 main 里面 ——
       main 带 relative z-10 是层叠上下文,放里面的 fixed 浮层升不到 z-30 的 nav 之上 -->
  <th:block th:replace="~{fragments/_update-modal :: updateModal(${updateInfo})}"></th:block>
</footer>
</body>

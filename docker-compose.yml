# 家庭账房 · v0.7 一键部署
# 用法:bash deploy/docker-up.sh(唯一入口:自检环境 + 自动生成密钥 .env + 起服务 + 验健康)
#       老手也可手动:cp .env.example .env → docker compose up -d
# 只 app + MySQL;反代/HTTPS 由你在前面自己挂(见 deploy/README.md「反代/HTTPS」)。
services:
  db:
    # 默认走 GHCR 上我们镜像的同一份 mysql:8.0 —— GHCR 大陆直连,而 Docker Hub 被限速会
    # 把大陆新手卡在第一步(v1.6.21)。想用官方源:.env 里设 MYSQL_IMAGE=mysql:8.0
    # (docker-up.sh 探不到 GHCR 副本时会自动这么兜,并把结果写回 .env)。
    image: ${MYSQL_IMAGE:-ghcr.io/luodi-nate/financial-management-mysql:8.0}
    restart: unless-stopped
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env 设置 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-finance}
      MYSQL_USER: ${DB_USER:-finance}
      MYSQL_PASSWORD: ${DB_PASS:?请在 .env 设置 DB_PASS}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - db-data:/var/lib/mysql
    # 不对宿主发布 3306 —— 只走 compose 内网,避免撞宿主已有 MySQL
    healthcheck:
      # 用真实查询,不用 mysqladmin ping —— ping 在「Access denied」时**也返回 0**
      # (MySQL 文档:服务器有应答就算活着),密码不对的库照样报 Healthy,故障被推到 app 里才炸。
      # v1.6.22 实测:老数据卷 + 新 .env 密码,旧判据给出 healthy,app 却 1045 崩溃重启不停。
      test: ["CMD-SHELL", "mysql -h127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  app:
    image: ghcr.io/luodi-nate/financial-management:latest
    build: .                       # 没有预构建镜像时:docker compose build 走源码构建
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 20000
      SERVER_ADDRESS: 0.0.0.0      # 容器内必须绑 0.0.0.0(systemd 下绑 127.0.0.1 在容器里打不通)
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-finance}
      DB_USER: ${DB_USER:-finance}
      DB_PASS: ${DB_PASS:?}
      UPLOAD_ROOT: /data/uploads
      REMEMBER_ME_KEY: ${REMEMBER_ME_KEY:?请在 .env 设置 REMEMBER_ME_KEY}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - uploads:/data/uploads
      - backups:/data/backups
      # v1.17 · 与可选富途网关共享的控制目录。app 这侧【无条件】挂(compose 不支持条件挂载),
      # 不启用网关时它就是个空卷(几 KB);"有没有启用"看网关容器有没有写过 /ctl/status。
      - futu-ctl:/ctl
    # 默认只发布到宿主 loopback —— 不裸奔公网,前置反代指到 127.0.0.1:SERVER_PORT
    ports:
      - "127.0.0.1:${SERVER_PORT:-20000}:20000"

  # 备份 sidecar:复用 app 镜像(自带 mysql client + /app/backup.sh),只换入口为 backup.sh。
  # 注意:这里不写 build: —— 镜像只由上面的 app 服务构建一次,backup 复用同一 tag。
  # 若两个服务都写 build: 同一 image,classic builder(非 BuildKit)会把同名镜像 build 两遍,
  # 第二遍打 tag 撞 "AlreadyExists" 而失败(BuildKit 会去重、不报;但不能依赖它)。
  backup:
    image: ghcr.io/luodi-nate/financial-management:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["bash", "/app/backup.sh"]
    # v1.28.3 · issue #25 · 不写这段就会继承 app 镜像的健康检查(curl localhost:20000/health)——
    #   备份容器里根本没跑 app,于是永远 starting → unhealthy,看着像坏了,真坏了反而分不出来。
    #   改成看「最近一次校验通过的备份」(backup.sh 成功时刷新 .last-ok)是不是 26 小时内的:
    #   一天没备上才 unhealthy。首次启动最多重试 12 次 × 5 分钟,所以起步宽限 70 分钟。
    healthcheck:
      test: ["CMD-SHELL", "find /data/backups/.last-ok -mmin -1560 2>/dev/null | grep -q ."]
      interval: 2m
      timeout: 10s
      start_period: 70m
      retries: 1
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-finance}
      DB_USER: ${DB_USER:-finance}
      DB_PASS: ${DB_PASS:?}
      RETENTION_DAYS: ${RETENTION_DAYS:-56}
      BACKUP_DIR: /data/backups
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - backups:/data/backups

  # ─────────────────────────────────────────────────────────────────────────
  # v1.17 · 富途 OpenD 网关(**可选组件** · profile: futu)
  #
  # 默认 `docker compose up -d` 【不拉、不起、不占磁盘】—— 只有显式启用才有它:
  #     docker compose --profile futu up -d        (或 bash deploy/docker-up.sh --with-futu)
  #
  # 这个镜像里【没有富途的任何文件】:它只有下载器 + 两个 shell 脚本 + 我们核对过的哈希清单;
  # OpenD 是容器首启时从富途官网下载的,下完先比对 sha256(不一致就拒绝启动)。
  # 镜像 digest 与自查命令见 Release 页;层扫描护栏见 scripts/scan-image-no-futu.sh。
  #
  # 两个端口都【不对宿主发布】:
  #   11111 = 富途 API,仅 compose 内网(且走 RSA 加密,同栈其它容器读不到你的持仓)
  #   22222 = OpenD 控制口,**没有鉴权** → 只绑容器内 127.0.0.1,连同栈都连不到。
  #           ⚠ 千万不要给这个服务加 ports: —— 那等于把券商网关的遥控器放到网上。
  opend:
    profiles: ["futu"]
    image: ${FUTU_OPEND_IMAGE:-ghcr.io/luodi-nate/financial-management-futu-opend:latest}
    restart: unless-stopped
    # OpenD 实测【不响应 SIGTERM】(给 60 秒也照样被 SIGKILL),所以别白等太久;
    # 硬杀已验证可恢复(安装物与状态目录完好,重启照常工作)。
    stop_grace_period: 15s
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      # 1 = 只装我们核对过哈希的版本(默认);0/1 之外的值按 0 处理
      FUTU_ALLOW_UNVERIFIED: ${FUTU_ALLOW_UNVERIFIED:-0}
      # API 通道 RSA 加密(默认开;密钥由本容器生成在共享卷里,app 用同一把)
      FUTU_API_RSA: ${FUTU_API_RSA:-1}
    volumes:
      - futu-opend-home:/home/futu     # OpenD 安装物 + 状态(它忽略 $HOME,只认 passwd 里的家目录)
      - futu-ctl:/ctl                  # 与 app 的控制通道(文件权限就是鉴权)
    expose:
      - "11111"

volumes:
  db-data:
  uploads:
  backups:
  futu-ctl:
  futu-opend-home:
